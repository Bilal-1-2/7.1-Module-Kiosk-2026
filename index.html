<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="assets/CSS/style.css" />
  <script src="assets/JS/script.js"></script>
  <style>
    /* Idle screen styles */
    #idle-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgb(255, 255, 255);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-in-out;
    }

    #idle-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Keep the main content behind */
    .scroll-container,
    #products-wrapper {
      position: relative;
      z-index: 1;
    }

    /* Idle screen content styling */
    #idle-screen main {
      height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-color: white;
    }

    #idle-screen img {
      height: 35vh;
    }

    #idle-screen .begin {
      height: 12vh;
      width: 60vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: red;
      color: white;
      border-radius: 6vh;
      font-size: 4vh;
      border: 0px;
      cursor: pointer;
      text-decoration: none;
      outline: none;
    }

    #idle-screen .begin:hover,
    #idle-screen .begin:focus,
    #idle-screen .begin:active {
      background-color: darkred;
    }

    /* Order buttons container - side by side */
    .order-buttons {
      display: flex;
      gap: 30px;
      width: 80vw;
      align-items: center;
    }

    /* Language toggle inside idle screen */
    .idle-lang-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #053631;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 20px;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
    }

    #idle-screen .begin.takeout {
      background-color: #8cd003;
      height: 20vh;
      width: 50%;
      font-size: 4vh;
      border-radius: 4vh;
    }

    #idle-screen .begin.takeout:hover,
    #idle-screen .begin.takeout:focus,
    #idle-screen .begin.takeout:active {
      background-color: #7ab800;
    }

    #idle-screen .begin.eat-in {
      background-color: #053631;
      height: 20vh;
      width: 50%;
      font-size: 4vh;
      border-radius: 4vh;
    }

    #idle-screen .begin.eat-in:hover,
    #idle-screen .begin.eat-in:focus,
    #idle-screen .begin.eat-in:active {
      background-color: #042820;
    }

    /* Products wrapper */
    #products-wrapper {
      width: 100%;
      overflow-y: auto;
      background-color: #f7f7f7;
    }

    /* Products grid */
    #products-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      padding: 1.5rem;
    }
  </style>
</head>

<body>
  <!-- Idle screen overlay -->
  <div id="idle-screen">
    <button class="idle-lang-toggle" id="idleLangToggle" onclick="toggleIdleLanguage()">NL</button>
    <main id="idle-main">
      <img src="assets\images\logos\begin.gif" alt="" onclick="showOrderOptions()" style="cursor: pointer" />
      <button class="begin" id="order-btn" onclick="showOrderOptions()">
        ORDER HERE
      </button>
    </main>
    <main id="order-options" style="display: none">
      <img src="assets\images\logos\begin.gif" alt="" />
      <div class="order-buttons">
        <button class="begin eat-in" onclick="selectOrderType('eat-in', event)">
          Eat-in
        </button>
        <button class="begin takeout" onclick="selectOrderType('take-out', event)">
          Take-out
        </button>
      </div>
    </main>
  </div>
  <header>
    <img src="assets/images/logos/logo_big_happy_herbivore_transparent.png" alt="" />
  </header>
  <main>










    <aside class="scroll-container"></aside>
    <div id="products-wrapper">
      <div id="products-container"></div>
  </main>
</body>

</html>
