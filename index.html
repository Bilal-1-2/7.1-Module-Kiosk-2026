<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Herbivore Kiosk</title>
    <link rel="stylesheet" href="assets/CSS/style.css" />
    <link
      rel="preload"
      href="assets/fonts/renos-rough.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script src="assets/JS/script.js"></script>
    <style>
      /* Idle screen styles */
      #idle-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #deff78;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-in-out;
      }

      #idle-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Keep the main content behind */
      .scroll-container,
      #products-wrapper {
        position: relative;
        z-index: 1;
      }

      /* Idle screen content styling */
      #idle-screen main {
        height: 70vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        background-color: #deff78;
        position: relative;
      }

      #idle-screen .begin {
        height: 12vh;
        width: 60vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ff7520;
        color: white;
        border-radius: 6vh;
        font-size: 4vh;
        border: 0px;
        cursor: pointer;
        text-decoration: none;
        outline: none;
      }

      #idle-screen .begin:hover,
      #idle-screen .begin:focus,
      #idle-screen .begin:active {
        background-color: #ffb181;
      }

      /* Order buttons container - side by side */
      .order-buttons {
        display: flex;
        gap: 30px;
        width: 80vw;
        align-items: center;
      }

      #idle-screen .begin.takeout {
        background-color: #8cd003;
        height: 20vh;
        width: 50%;
        font-size: 4vh;
        border-radius: 4vh;
      }

      #idle-screen .begin.takeout:hover,
      #idle-screen .begin.takeout:focus,
      #idle-screen .begin.takeout:active {
        background-color: #7ab800;
      }

      #idle-screen .begin.eat-in {
        background-color: #053631;
        height: 20vh;
        width: 50%;
        font-size: 4vh;
        border-radius: 4vh;
      }

      #idle-screen .begin.eat-in:hover,
      #idle-screen .begin.eat-in:focus,
      #idle-screen .begin.eat-in:active {
        background-color: #042820;
      }

      /* Products wrapper */
      #products-wrapper {
        width: 100%;
        overflow-y: auto;
        background-color: #deff78;
      }

      /* Products grid */
      #products-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        padding: 1.5rem;
      }

      /* Language Selector - below Eat-in/Take-out */
      .language-selector {
        display: flex;
        gap: 20px;
        margin-top: 30px;
      }

      .lang-btn {
        display: flex;
        width: 20vw;
        height: 10vh;
        flex-direction: column;
        align-items: center;
        background-color: #ffb181;
        border: 3px solid #053631;
        border-radius: 15px;
        padding: 10px 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        justify-content: center;
      }

      .lang-btn:hover {
        background-color: #deff78;
      }

      .lang-btn.active {
        background-color: #053631;
        border-color: #053631;
      }

      .lang-btn.active .lang-label {
        color: white;
      }

      .lang-btn .flag-img {
        width: 80%;
        /* height: 40px; */
        object-fit: contain;
        margin-bottom: 5px;
      }

      .lang-btn .lang-label {
        font-size: 2.2rem;
        font-weight: bold;
        color: #053631;
      }
    </style>
  </head>
  <body>
    <!-- Idle screen overlay -->
    <div id="idle-screen">
      <main id="idle-main">
        <img
          src="assets\images\logos/begin 1.gif"
          alt=""
          onclick="showOrderOptions()"
          style="height: 35vh"
        />
        <button class="begin" id="order-btn" onclick="showOrderOptions()">
          ORDER HERE
        </button>
      </main>
      <main id="order-options" style="display: none">
        <img src="assets\images\logos\begin 1.gif" alt="" />
        <div class="order-buttons">
          <button
            class="begin eat-in"
            onclick="selectOrderType('eat-in', event)"
          >
            Eat-in
          </button>
          <button
            class="begin takeout"
            onclick="selectOrderType('take-out', event)"
          >
            Take-out
          </button>
        </div>
        <div class="language-selector">
          <button class="lang-btn" id="langNL" onclick="setLanguage('nl')">
            <img
              src="assets/images/logos/NL-flag.png"
              alt="NL"
              class="flag-img"
            />
            <span class="lang-label">NL</span>
          </button>
          <button
            class="lang-btn active"
            id="langEN"
            onclick="setLanguage('en')"
          >
            <img
              src="assets/images/logos/UK-flag.png"
              alt="EN"
              class="flag-img"
            />
            <span class="lang-label">EN</span>
          </button>
        </div>
      </main>
    </div>
    <header>
      <img
        src="assets/images/logos/logo_big_happy_herbivore_transparent.png"
        alt=""
      />
    </header>
    <main>
      <aside class="scroll-container"></aside>
      <div id="products-wrapper">
        <div id="products-container"></div>
      </div>
    </main>
  </body>
</html>
