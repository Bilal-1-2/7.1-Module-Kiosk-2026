<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/CSS/idle.css" />
    <style>
      /* Fade overlay styles */
      #fade-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
        z-index: 9999;
      }
      #fade-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
    </style>
  </head>
  <body>
    <div id="fade-overlay"></div>
    <a href="index.html" id="fade-link" style="text-decoration: none">
      <main>
        <img src="assets\images\logos\begin.gif" alt="" />
        <button class="begin">ORDER HERE</button>
      </main>
    </a>
    <script>
      document
        .getElementById("fade-link")
        .addEventListener("click", function (e) {
          e.preventDefault();
          const overlay = document.getElementById("fade-overlay");
          overlay.classList.add("active");
          setTimeout(function () {
            window.location.href = "index.html";
          }, 500);
        });
    </script>
  </body>
</html>
